# Bestand: ${DOCKER_ROOT}/nginx/conf/liberalevrienden.conf

server {
    listen 80;
    listen 443 ssl;
    server_name liberalevrienden.social;

    # Gebruik de certificaten die NPM al heeft aangemaakt
    # Let op: NPM slaat deze op in /etc/letsencrypt/live/npm-[ID]/
    # Als je dit bestand handmatig beheert, moet je naar het juiste pad verwijzen.

    # De landingspagina (index.html)
    location = / {
        root /var/www/liberalevrienden;
        index index.html;
    }

    # Auto-discovery voor Element X en andere clients
    location /.well-known/matrix/ {
        root /var/www/liberalevrienden;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Zodra je Synapse activeert in je docker-compose, voeg je dit toe:
    # location /_matrix {
    #     proxy_pass http://synapse:8008;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    # }
}
